name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.3)"
        required: true
        default: "v1.0.3"
      prerelease:
        description: "Mark as pre-release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Publish
        run: dotnet publish -c Release -r win-x64 --self-contained false -o publish
      - name: Check exe exists
        run: |
          if (-not (Test-Path publish\WindowCover.exe)) { throw "WindowCover.exe not found in publish/" }
          Get-ChildItem publish | Format-Table Name, Length
      - name: Zip publish output
        run: Compress-Archive -Path publish\* -DestinationPath WindowCover-win-x64.zip
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: WindowCover ${{ inputs.tag }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: WindowCover-win-x64.zip
